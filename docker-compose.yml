version: "3"

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./homeassistant:/config
      - /mnt/hdd/cameras:/media/cameras:ro
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Paris

  influxdb:
    container_name: influxdb
    image: influxdb:2.6
    volumes:
      - /mnt/hdd/influxdb:/var/lib/influxdb2
    ports:
      - "8086:8086"
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    volumes:
      - /mnt/hdd/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      
  nodered:
    container_name: nodered
    image: nodered/node-red:latest
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered_data:/data
    environment:
      - TZ=Europe/Paris

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    volumes:
      - ./zigbee2mqtt/data:/app/data
    environment:
      - TZ=Europe/Zurich

  # Thread : radio 1 du SLZB-MR5U (OpenThread RCP) exposée en TCP sur le port 7638
  otbr:
    container_name: otbr
    image: ghcr.io/ownbee/hass-otbr-docker:v0.3.0
    restart: unless-stopped
    privileged: true
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./otbr_data:/data/thread
    environment:
      DEVICE: /tmp/ttyOTBR
      NETWORK_DEVICE: 192.168.1.156:7638
      BAUDRATE: 460800
      FLOW_CONTROL: 0
      BACKBONE_IF: eth0
      FIREWALL: 1
      NAT64: 1
      AUTOFLASH_FIRMWARE: 0
      OTBR_REST_PORT: 8081
      OTBR_WEB: 0
      OTBR_LOG_LEVEL: notice
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "1m"

  # Serveur Matter (matter.js, remplaçant de python-matter-server) — WebSocket ws://localhost:5580/ws
  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:1.4.0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./matter_data:/data
    environment:
      - PRIMARY_INTERFACE=eth0
      - TZ=Europe/Zurich
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "1m"

  samba:
    container_name: samba
    image: dperson/samba
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/hdd/photos:/photos
      - /mnt/hdd/cameras:/cameras:ro
      - ./samba/smb.conf:/etc/samba/smb.conf:ro
    environment:
      - TZ=Europe/Paris
    command: -u "photos;photos123" -u "camera;camera123" -n

  ftp:
    container_name: ftp
    image: delfer/alpine-ftp-server
    restart: unless-stopped
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - /mnt/hdd/cameras:/home/camera
    environment:
      - USERS=camera|camera123|/home/camera
      - ADDRESS=192.168.1.133
      - MIN_PORT=21000
      - MAX_PORT=21010

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8089:80/tcp"

    environment:
      TZ: Europe/Zurich
      WEBPASSWORD: dgasduigknsdgio

    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d

    cap_add:
      - NET_ADMIN

  solar-virtual-plug1:
    container_name: solar-virtual-plug1
    image: node:alpine
    command: >
      sh -c "npm install -g solar-manager-virtual-device &&
             solar-manager-virtual-device /etc/plug1.json"
    volumes:
      - ./solar-manager-virtual-device/plug1.json:/etc/plug1.json
    networks:
      solar-macvlan:
        ipv4_address: 192.168.1.171
    restart: unless-stopped

