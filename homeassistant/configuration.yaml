#############################################
# CONFIGURATION DE BASE
#############################################

# Charge les intégrations par défaut
default_config:

# Media Browser pour les caméras
homeassistant:
  media_dirs:
    cameras: /media/cameras


#############################################
# INFLUXDB (v2)
#############################################

influxdb:
  api_version: 2
  host: 192.168.1.133
  port: 8086
  token: !secret influxdb_token
  organization: MaisonRussy
  bucket: Homeassistant
  ssl: false
  default_measurement: state
  # Attention : un include glob l'emporte sur un exclude glob → globs ciblés
  # Les sensor.fronius_* (MQTT) ne sont PAS inclus : Node-RED les écrit déjà en direct (Modbus)
  include:
    entity_globs:
      # --- Photovoltaïque / réseau (intégration Fronius) ---
      - sensor.symo_15_0_3_m_1_*
      - sensor.ferme_symo_15_0_3_m_1_*
      - sensor.smart_meter_ts_65a_3_*
      - sensor.solarnet_*

      # --- Prises connectées (puissance + énergie) ---
      - sensor.swiss_domotique_plug_*_power
      - sensor.swiss_domotique_plug_*_energy
      - sensor.smart_plug_v2_*_power
      - sensor.smart_plug_v2_*_energy
      - sensor.congelateur_miele_*power
      - sensor.congelateur_miele_*energy
      - sensor.prise_nomade_*power
      - sensor.prise_nomade_*energy
      - sensor.lave_vaiselle_haut_*power
      - sensor.lave_vaiselle_haut_*energy

      # --- Chauffage : PAC Stiebel Eltron, Askoheat, CE-Boiler ---
      - sensor.stiebel_eltron_*
      - sensor.cave_stiebel_eltron_*
      - binary_sensor.stiebel_eltron_*
      - sensor.askoheat_*
      - sensor.ce_boiler_*

      # --- Borne de recharge go-eCharger ---
      - sensor.go_echarger_*

      # --- Capteurs climat : sensor.<pièce>_climat_<mesure> ---
      # Zigbee (Z2M) : suffixes anglais ; Matter : suffixes français
      - sensor.*_climat_temperature
      - sensor.*_climat_humidity
      - sensor.*_climat_battery
      - sensor.*_climat_humidite
      - sensor.*_climat_batterie

    entities:
      # Prévision solaire
      - sensor.power_production_now
      - sensor.energy_production_today
      - sensor.energy_production_today_remaining
      - sensor.energy_production_tomorrow
      - sensor.energy_current_hour
      - sensor.energy_next_hour
      # Tarif dynamique
      - sensor.groupee_vario
      - sensor.groupee_double


#############################################
# INPUT_NUMBER
# Puissance simulée pilotée par Node-RED
#############################################

input_number:
  ce_boiler_power_simulated:
    name: "CE Boiler Power Simulated"
    min: 0
    max: 6000
    step: 100
    unit_of_measurement: "W"


#############################################
# TEMPLATE SENSORS
#############################################

template:
  - sensor:

      # Capteur de puissance CE-Boiler (W)
      - name: "CE Boiler Power"
        unique_id: ce_boiler_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('input_number.ce_boiler_power_simulated') | float(0) }}

      # Tarif électrique selon l'heure
      - name: "Tarif_double_electrique"
        unit_of_measurement: "CHF/kWh"
        state: >
          {% set h = now().hour %}
          {% if h >= 23 or h < 7 %}
            0.22
          {% elif h >= 12 and h < 17 %}
            0.22
          {% else %}
            0.31
          {% endif %}


#############################################
# SENSORS CLASSIQUES
#############################################

sensor:

  # Puissance instantanée ASKOHEAT (W)
  - platform: rest
    name: "ASKOHEAT Power W"
    unique_id: askoheat_power_w
    resource: "http://192.168.1.108/STATUS.JSON"
    value_template: >
      {{ value_json.ACTUAL_VALUES.ACTUAL_HEATER_LOAD_WATTS.split(' ')[0] | float }}
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    scan_interval: 5

  # Énergie ASKOHEAT (kWh) - intégration de Riemann
  - platform: integration
    name: "ASKOHEAT Energy"
    unique_id: askoheat_energy
    source: sensor.askoheat_power_w
    unit_prefix: k
    round: 2

  # Énergie CE-Boiler simulée (kWh) - intégration de Riemann
  - platform: integration
    name: "CE Boiler Energy"
    unique_id: ce_boiler_energy
    source: sensor.ce_boiler_power
    unit_prefix: k
    method: left
    round: 2


#############################################
# COMPTEURS ÉNERGÉTIQUES (UTILITY METER)
#############################################

utility_meter:

  # Consommation journalière
  energy_daily:
    source: sensor.smart_meter_ts_65a_3_energie_reelle_consommee
    cycle: daily
    tariffs:
      - peak
      - offpeak

  # Consommation mensuelle
  energy_monthly:
    source: sensor.smart_meter_ts_65a_3_energie_reelle_consommee
    cycle: monthly
    tariffs:
      - peak
      - offpeak

  # Consommation trimestrielle
  energy_quarterly:
    source: sensor.smart_meter_ts_65a_3_energie_reelle_consommee
    cycle: quarterly
    tariffs:
      - peak
      - offpeak

  # Consommation annuelle
  energy_yearly:
    source: sensor.smart_meter_ts_65a_3_energie_reelle_consommee
    cycle: yearly
    tariffs:
      - peak
      - offpeak


#############################################
# INTERFACE & AUTOMATISATIONS
#############################################

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
